name: UI quick check

on:
  push:
    branches:
      - ui/upstream-polish-2026-10
    paths:
      - 'V2rayNG/app/src/main/java/**'
      - 'V2rayNG/app/src/main/res/**'
      - 'V2rayNG/app/build.gradle.kts'
      - 'V2rayNG/gradle/**'
      - 'V2rayNG/gradlew'
      - 'V2rayNG/settings.gradle.kts'
      - '.github/workflows/ui-quick-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-resources:
    name: Validate Android UI resources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI branch without submodules
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ui-gradle-${{ runner.os }}-${{ hashFiles('V2rayNG/gradle/libs.versions.toml', 'V2rayNG/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ui-gradle-${{ runner.os }}-

      - name: Process debug Android resources
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:processPlaystoreDebugResources
