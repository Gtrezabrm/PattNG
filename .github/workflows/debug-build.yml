name: Debug Build

# Fast, installable debug APK for UI iteration.
# Reuse the exact upstream release's Aether core when its AndroidLibXrayLite gitlink matches;
# continue using the local cached/build steps for the other native components.
# Runs on a push to ui/** branches or by hand from Actions.

on:
  workflow_dispatch:
    inputs:
      abi_filters:
        description: "ABIs to build the APK for, separated by semicolons (arm64-v8a fits almost every phone); empty builds a universal APK"
        required: false
        default: "arm64-v8a"
        type: string
  push:
    branches:
      - "ui/**"

permissions:
  contents: read

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: "1.26"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    # The upstream owner has already compiled Aether for this exact AndroidLibXrayLite revision.
    # GitHub Actions caches are repository-scoped, so use the matching official release APK's .so instead.
    - name: Reuse matching upstream Aether binaries
      env:
        ABI_FILTERS: ${{ inputs.abi_filters || 'arm64-v8a' }}
        UPSTREAM_RELEASE: "2.3.13-P68"
        EXPECTED_ANDROIDLIBXRAYLITE_SHA: "161a86dc18a97adac49bcf4a817768d7715fdfde"
      run: |
        set -euo pipefail

        actual_sha="$(git -C AndroidLibXrayLite rev-parse HEAD)"
        if [[ "$actual_sha" != "$EXPECTED_ANDROIDLIBXRAYLITE_SHA" ]]; then
          echo "::error::Refusing upstream Aether binary: AndroidLibXrayLite is $actual_sha, expected $EXPECTED_ANDROIDLIBXRAYLITE_SHA for release $UPSTREAM_RELEASE."
          exit 1
        fi

        if [[ -z "$ABI_FILTERS" ]]; then
          abis="arm64-v8a armeabi-v7a x86_64"
        else
          abis="$(printf '%s' "$ABI_FILTERS" | tr ';' ' ')"
        fi

        mkdir -p libs-aether
        for abi in $abis; do
          case "$abi" in
            arm64-v8a) asset="PattNG_${UPSTREAM_RELEASE}_arm64-v8a.apk" ;;
            armeabi-v7a) asset="PattNG_${UPSTREAM_RELEASE}_armeabi-v7a.apk" ;;
            x86_64) asset="PattNG_${UPSTREAM_RELEASE}_x86_64.apk" ;;
            *)
              echo "::error::No prebuilt Aether library is provided for ABI '$abi'. Supported Aether ABIs: arm64-v8a, armeabi-v7a, x86_64."
              exit 1
              ;;
          esac

          apk_url="https://github.com/patterniha/PattNG/releases/download/${UPSTREAM_RELEASE}/${asset}"
          temp_apk="$(mktemp --suffix=.apk)"
          echo "Fetching the official ${UPSTREAM_RELEASE} APK for ${abi}"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$apk_url" --output "$temp_apk"

          if ! unzip -Z1 "$temp_apk" | grep -qx "lib/${abi}/libaether.so"; then
            echo "::error::The official APK ${asset} does not contain lib/${abi}/libaether.so."
            exit 1
          fi
          mkdir -p "libs-aether/${abi}"
          unzip -p "$temp_apk" "lib/${abi}/libaether.so" > "libs-aether/${abi}/libaether.so"
          test -s "libs-aether/${abi}/libaether.so"
          rm -f "$temp_apk"
          echo "Reused $(du -h "libs-aether/${abi}/libaether.so" | cut -f1) Aether core for ${abi}"
        done

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        # The client is built from a checkout of its own; there is no go.sum here to cache by.
        cache: false

    # The Aether core runs Psiphon as a program of its own, the psiphon-tunnel-core console client,
    # which the app ships beside the core as libpsiphon-tunnel-core.so; see compile-psiphon.sh.
    - name: Restore cached Psiphon client
      id: cache-psiphon-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/psiphon-build.sh') }}-${{ hashFiles('compile-psiphon.sh') }}

    - name: Build the Psiphon client
      if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-psiphon.sh

    - name: Save the Psiphon client
      if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/psiphon-build.sh') }}-${{ hashFiles('compile-psiphon.sh') }}

    # Tor's bridges run through a pluggable transport, a program of its own: lyrebird, which aether
    # builds and the app ships beside the core as liblyrebird.so; see compile-pt.sh.
    - name: Restore cached pluggable transport
      id: cache-pt-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/pt-build.sh') }}-${{ hashFiles('compile-pt.sh') }}

    - name: Build the pluggable transport
      if: steps.cache-pt-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-pt.sh

    - name: Save the pluggable transport
      if: steps.cache-pt-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/pt-build.sh') }}-${{ hashFiles('compile-pt.sh') }}

    - name: Stage the native libraries
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app
        cp -r ${{ github.workspace }}/libs-aether/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-psiphon/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-pt/. ${{ github.workspace }}/V2rayNG/app/libs/

    # Psiphon's client starts with the newest server list the build could fetch, so a fresh install has
    # servers before it can reach the list on its own; see fetch-psiphon-servers.sh.
    - name: Fetch the Psiphon server list
      run: |
        bash fetch-psiphon-servers.sh

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: 'patterniha/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build and test
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ABI_ARG=""
        if [ -n "${{ inputs.abi_filters || 'arm64-v8a' }}" ]; then
          ABI_ARG="-PABI_FILTERS=${{ inputs.abi_filters || 'arm64-v8a' }}"
        fi
        # The JVM unit tests first, so that a failing test or a compile error stops the build and is named in its log.
        set -o pipefail
        { ./gradlew :app:testPlaystoreDebugUnitTest $ABI_ARG && ./gradlew :app:assemblePlaystoreDebug $ABI_ARG; } 2>&1 \
          | tee "${{ github.workspace }}/gradle.log"

    # The full log can be hard to open; the compile errors and failed tests are repeated as one annotation on the run.
    - name: Report errors as an annotation
      if: failure()
      run: |
        msg=$(grep -E '^e: |FAILED|What went wrong|^> ' "${{ github.workspace }}/gradle.log" | head -60 \
          | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
        echo "::error title=Gradle errors::${msg}"

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: ${{ github.workspace }}/V2rayNG/app/build/reports/tests
        if-no-files-found: ignore

    - name: Upload debug APK
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: PattNG-debug-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
        if-no-files-found: error

    - name: Check the native libraries in the APK
      if: success()
      run: |
        # Same check as build.yml: every ABI built has to carry the Aether core, its Psiphon client and its pluggable transport.
        status=0
        for apk in ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/debug/*.apk; do
          entries=$(unzip -Z1 "$apk" | grep '^lib/' || true)
          echo "$(basename "$apk"):"
          echo "$entries" | sed 's/^/  /'
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "$entries" | grep -q "^lib/$abi/" || continue
            for lib in libaether.so libpsiphon-tunnel-core.so liblyrebird.so; do
              if ! echo "$entries" | grep -qx "lib/$abi/$lib"; then
                echo "::error::$(basename "$apk") lacks lib/$abi/$lib"
                status=1
              fi
            done
          done
        done
        exit $status
